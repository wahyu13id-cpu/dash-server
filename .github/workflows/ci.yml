name: CI

# Uji otomatis setiap push ke main dan setiap pull request:
#   backend  -> go vet, go test, go build
#   frontend -> npm ci, tsc --noEmit, vite build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          set -o pipefail
          go test ./... -count=1 -timeout 10m 2>&1 | tee /tmp/go-test.log

      # Ringkasan kegagalan yang bisa dibaca tanpa login: log job di API GitHub
      # butuh token, sementara ringkasan check-run dan anotasinya terbuka untuk
      # repo publik. Jadi kutipan keluaran 'go test' ditaruh di sana.
      - name: Ringkas kegagalan tes
        if: failure()
        run: |
          {
            echo '### Keluaran `go test` yang gagal'
            echo
            echo '```'
            awk '/^--- FAIL|^panic:|^    --- FAIL/{p=1} p' /tmp/go-test.log | tail -c 40000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^ *--- FAIL|^panic:' /tmp/go-test.log | head -20 | while read -r line; do
            echo "::error title=Kegagalan tes::${line}"
          done

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/server

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
