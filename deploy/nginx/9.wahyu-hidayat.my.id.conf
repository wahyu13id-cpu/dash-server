# nginx reverse proxy for the Server Dashboard.
#
# Install to /etc/nginx/sites-available/9.wahyu-hidayat.my.id.conf and enable:
#   ln -s /etc/nginx/sites-available/9.wahyu-hidayat.my.id.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Then obtain a certificate (this rewrites the file and adds the TLS blocks):
#   certbot --nginx -d 9.wahyu-hidayat.my.id
#
# After TLS is active, set DASH_COOKIE_SECURE=true in /etc/dashboard/dashboard.env
# and restart the service.

upstream dashboard_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 9.wahyu-hidayat.my.id;

    # Allow Let's Encrypt HTTP-01 validation before the redirect is active.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://dashboard_app;
        proxy_http_version 1.1;

        # WebSocket support for /api/terminal/sessions/{id}/stream
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # File uploads (POST /api/files/upload): allow up to DASH_MAX_UPLOAD_SIZE
        # (512 MiB). Request buffering is deliberately left at its default (on):
        # nginx then reads the whole body before answering, so early replies such
        # as 401/409/413 still reach the browser instead of turning into a 502
        # when the app rejects the upload before the body was consumed. The app
        # itself still streams the body straight to disk, so nginx only needs
        # client_body_temp_path space (see also the size hint in the README).
        client_max_body_size 512m;
    }
}

